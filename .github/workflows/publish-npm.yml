name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          check-latest: true
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("package.json", "utf8")).version)')"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "Release tag must be v$package_version, got $RELEASE_TAG." >&2
            exit 1
          fi
      - name: Verify package
        run: |
          npm run verify
          npm run test:verify
          npm run test:sync
          npm run test:package
      - name: Publish to npm
        run: npm publish --access public --provenance --tag omp


