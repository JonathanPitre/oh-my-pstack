name: Sync upstream pstack

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-pstack-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - id: base
        name: Record validation base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          check-latest: true
          package-manager-cache: false

      - id: update
        name: Apply upstream update and detect changes
        run: |
          node scripts/sync-upstream.mjs --apply
          if [[ -n "$(git status --porcelain --untracked-files=all -- skills upstream.lock.json package.json .claude-plugin/plugin.json .codex-plugin/plugin.json ':(exclude)**/node_modules/**')" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.update.outputs.changed == 'true'
        name: Verify package
        run: npm run verify

      - if: steps.update.outputs.changed == 'true'
        name: Test updater
        run: npm run test:sync

      - if: steps.update.outputs.changed == 'true'
        name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - if: steps.update.outputs.changed == 'true'
        name: Test bundled scripts
        run: |
          bun install --cwd skills/poteto-mode/scripts --frozen-lockfile
          bun test orch watch-pr
          bun run --cwd skills/poteto-mode/scripts typecheck

      - if: steps.update.outputs.changed == 'true'
        id: validated
        name: Capture validated update tree
        run: |
          git add --all -- skills upstream.lock.json package.json .claude-plugin/plugin.json .codex-plugin/plugin.json ':(exclude)**/node_modules/**'
          echo "tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
      - id: update_pr
        if: steps.update.outputs.changed == 'true'
        name: Open update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: |
            skills
            upstream.lock.json
            package.json
            .claude-plugin/plugin.json
            .codex-plugin/plugin.json
            :(exclude)**/node_modules/**
          commit-message: "chore: sync upstream pstack"
          title: "chore: sync upstream pstack"
          body: |
            Automated update from the pinned authoritative Cursor pstack source.

            Adapted files are reconciled with a deterministic three-way merge;
            the proposal is merged only after this workflow's validation passes.
          branch: automation/upstream-pstack
          base: main
          delete-branch: true
      - name: Merge validated update
        if: steps.update.outputs.changed == 'true' && steps.update_pr.outputs.pull-request-number != '' && steps.update_pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.update_pr.outputs.pull-request-number }}
          PR_HEAD_SHA: ${{ steps.update_pr.outputs.pull-request-head-sha }}
          VALIDATED_TREE: ${{ steps.validated.outputs.tree }}
          VALIDATED_BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin automation/upstream-pstack
          if [[ "$(git rev-parse FETCH_HEAD)" != "$PR_HEAD_SHA" || "$(git rev-parse 'FETCH_HEAD^{tree}')" != "$VALIDATED_TREE" ]]; then
            echo "Update PR differs from validated tree." >&2
            exit 1
          fi
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" != "$VALIDATED_BASE" ]]; then
            echo "main changed during validation; rerun the sync." >&2
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --squash --match-head-commit "$PR_HEAD_SHA"


